<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Haggle — Search Results</title>
  <script>
    const params = new URLSearchParams(window.location.search);
    const q = params.get('q') || '';
    if (q) {
      window.location.replace('/#/search/' + encodeURIComponent(q));
    } else {
      window.location.replace('/#/');
    }
  </script>
</head>
<body>
  <p>Loading search results...</p>
</body>
</html>
